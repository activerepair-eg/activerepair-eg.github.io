<!doctype html><meta charset=utf-8><title>Active Repair - الإدارة</title><meta name="robots" content="noindex"><meta name="theme-color" content="#E2501F"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><meta name=viewport content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f1ec;font-family:Tahoma,Arial,sans-serif;color:#2b2b2b}
.wrap{max-width:520px;margin:0 auto;padding:14px}
.hd{background:#fff;border-radius:16px;padding:18px 14px 14px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08);border-bottom:5px solid #E2501F}
.hd img{height:110px;display:block;margin:0 auto 6px;border-radius:8px}
.hd h1{margin:0;font-family:Georgia,serif;font-weight:normal;font-size:34px;color:#E2501F}
.tag{display:inline-block;margin-top:8px;background:#E2501F;color:#fff;padding:6px 22px;border-radius:6px;font-size:15px}
.card{background:#fff;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
input[type=text],input[type=tel],input[type=password],textarea,select{width:100%;padding:13px;font-size:16px;border:2px solid #e3d6cc;border-radius:10px;font-family:inherit;margin-top:6px;background:#fff}
textarea{min-height:80px}
input:focus,textarea:focus,select:focus{outline:none;border-color:#E2501F}
.c{text-align:center;letter-spacing:1px}
.btn{margin-top:10px;padding:14px;width:100%;color:#fff;border:0;border-radius:10px;font-size:17px;cursor:pointer;background:#E2501F;display:block;text-align:center;text-decoration:none;font-family:inherit}
.btn.g{background:#1E7B5A}.btn.w{background:#25a244}.btn.s{background:#555;font-size:14px;padding:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f0e8e1}
.row span{color:#777;font-size:14px}.row b{font-size:16px}
.price{color:#E2501F;font-size:22px}
.terms{background:#fbf6f1;border:1px solid #f0e2d6;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px;line-height:1.7}
.terms h3{margin:0 0 6px;color:#E2501F;font-size:16px}.terms ul{margin:0;padding-right:18px}
.ok{background:#e6f4ee;color:#1E7B5A;padding:12px;border-radius:10px;text-align:center;margin-top:14px;font-weight:bold}
.err{color:#b00020;text-align:center;font-weight:bold;margin-top:12px}
.ft{text-align:center;font-size:13px;color:#666;margin:16px 0 6px;line-height:1.8}
label{display:block;margin-top:14px;font-size:15px}
.ph h4{margin:14px 0 6px;color:#E2501F;font-size:15px}
.grid{display:flex;flex-wrap:wrap;gap:8px}.grid div{position:relative}
.grid img{width:100px;height:100px;object-fit:cover;border-radius:8px;border:1px solid #eee}
.grid.big img{width:calc(50vw - 40px);max-width:230px;height:auto;aspect-ratio:1}
.x{position:absolute;top:2px;left:2px;background:#b00020;color:#fff;border:0;border-radius:50%;width:24px;height:24px;cursor:pointer}
.cu{border:2px solid #eee;border-radius:12px;padding:10px;margin-top:10px}
.cu.sel{border-color:#E2501F;background:#fff8f4}
.cu small{color:#777;display:block;margin-top:2px}
.code{font-size:26px;font-weight:bold;color:#E2501F;letter-spacing:2px;direction:ltr;text-align:center;background:#fff8f4;border:2px dashed #E2501F;border-radius:12px;padding:14px;margin:10px 0;word-break:break-all}
.nav{display:flex;gap:6px;margin-top:10px}.nav a{flex:1;text-align:center;background:#fff;border-radius:10px;padding:10px 2px;font-size:13px;color:#2b2b2b;text-decoration:none;box-shadow:0 1px 6px rgba(0,0,0,.06)}.nav a.on{background:#E2501F;color:#fff}
.ad{background:#fff;border-radius:16px;padding:12px;margin-top:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}.ad img{width:100%;border-radius:12px;display:block}.ad video{width:100%;border-radius:12px;display:block;background:#000}
.vid{position:relative;width:100%;max-width:360px;margin:0 auto;aspect-ratio:9/16}.vid iframe,.fbx iframe{border:0;border-radius:12px;width:100%;height:100%}.fbx{height:560px}
.ad h3{margin:10px 2px 4px;color:#E2501F;font-size:17px}.ad p{margin:4px 2px;line-height:1.8;font-size:15px;white-space:pre-line}.ad small{color:#888;display:block;margin:6px 2px 0}
</style>

function esc(t){var d=document.createElement("div");d.textContent=t==null?"":t;return d.innerHTML}
function $(i){return document.getElementById(i)}

var API='https://script.google.com/macros/s/AKfycbyNAYdWDuPz1TXULE2G6oUrCoZwYs9N7IEtLs94ZktOOwLQAaDe_Akph-JXoHISzxdUpA/exec';
var TOK=localStorage.getItem("ar_tok"),CUR=null,LIST=[];
function call(op,args){return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({op:op,args:args})}).then(function(r){return r.json()})}
function showLogin(m){$("main").style.display="none";$("login").style.display="block";$("le").textContent=m||""}
function showMain(){$("login").style.display="none";$("main").style.display="block";load();loadAds()}
function doLogin(){var pw=$("pw").value;if(!pw)return;$("le").textContent="";$("lb").disabled=true;
call("login",[pw]).then(function(r){$("lb").disabled=false;if(r.error){$("le").textContent=r.error;return}TOK=r.token;localStorage.setItem("ar_tok",TOK);$("pw").value="";showMain()}).catch(function(){$("lb").disabled=false;$("le").textContent="حصل خطأ، حاول تاني"})}
function sess(r){if(r&&r.error==="session"){localStorage.removeItem("ar_tok");TOK=null;showLogin("الجلسة خلصت، ادخل تاني");return false}return true}
function load(){call("list",[TOK]).then(function(r){if(!sess(r))return;LIST=r.r||[];render()}).catch(function(){$("list").textContent="مفيش اتصال، حاول تاني"})}
function norm(s){return String(s||"").replace(/[\u0660-\u0669]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[\s\-]/g,"").toLowerCase()}
function render(){var q=norm($("q").value),l=LIST,idx=[];l.forEach(function(c,i){if(c.cancelled&&!$("sc").checked)return;if(!q||norm([c.code,c.phone,c.address,c.name,c.device,c.fault,c.area].join(" ")).indexOf(q)>=0)idx.push(i)});$("qn").textContent=q?idx.length+" نتيجة":"";var dc=l.filter(function(c){return c.dups&&c.dups.length&&!c.cancelled}).length;$("dn").style.display=dc?"block":"none";$("dn").textContent=dc?"فيه "+dc+" حالات مكررة (متعلّم عليها ⚠)، تقدر تلغي واحدة منهم":"";
$("list").innerHTML=idx.length?idx.map(function(i){var c=l[i];var dp=c.dups&&c.dups.length&&!c.cancelled;return "<div class='cu"+(CUR==c.code?" sel":"")+"' style='"+(c.cancelled?"opacity:.55;":"")+(dp?"border-color:#d98c00;background:#fffaf0;":"")+"' onclick='pick("+i+")'>"+(dp?"<div style=\"color:#8a5a00;font-size:13px;font-weight:bold;margin-bottom:4px\">⚠ مكرر: "+c.dups.map(function(d){return esc(d.why)+" (كود "+d.code+")"}).join("، ")+"</div>":"")+(c.visit?"<span style=\"background:#1E7B5A;color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;margin-left:6px\">زيارة منزلية</span>":"")+"<b>"+esc(c.name)+"</b> - "+esc(c.device)+(c.visit&&c.area?" - "+esc(c.area):"")+"<small>الكود: "+c.code+" | "+esc(c.status)+(c.approved?" | موافق":"")+"</small><button class='btn s' style='padding:9px;font-size:14px' onclick='event.stopPropagation();editC(\""+c.code+"\")'>تعديل البيانات</button><a class='btn w' style='padding:9px;font-size:14px' target='_blank' onclick='event.stopPropagation()' href='"+c.wa+"'>إرسال رابط المتابعة على واتساب</a>"+(c.cancelled?"<button class='btn s' onclick='event.stopPropagation();canc(\""+c.code+"\",0)'>استرجاع</button>":"<button class='btn s' style='background:#8a2d1a' onclick='event.stopPropagation();canc(\""+c.code+"\",1)'>إلغاء (ملغي)</button>")+"</div>"}).join(""):"مفيش نتائج"}
function canc(code,on){if(on&&!confirm("تعليم الطلب ده ملغي وإخفاؤه من القايمة؟ (مش بيتمسح)"))return;call("cancel",[TOK,code,!!on]).then(function(r){if(sess(r))load()})}
function pick(i){var code=LIST[i].code,name=LIST[i].name;CUR=code;$("up").style.display="block";$("ut").textContent="صور العميل: "+name+" ("+code+")";
$("ty").innerHTML=Object.keys(LABELS).map(function(k){return "<option value="+k+">"+LABELS[k]+"</option>"}).join("");load();photos();$("up").scrollIntoView({behavior:"smooth"})}
function photos(){$("pl").innerHTML="";call("photos",[TOK,CUR]).then(function(r){if(!sess(r))return;
$("pl").innerHTML=(r.r||[]).map(function(p){return "<div class=ph><h4>"+LABELS[p.type]+"</h4><div class=grid><div><img src='"+p.data+"'><button class=x onclick=\"del('"+p.id+"')\">x</button></div></div></div>"}).join("")})}
function del(id){if(!confirm("مسح الصورة؟"))return;call("del",[TOK,id]).then(function(r){if(sess(r))photos()})}
function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=1000,s=Math.min(1,m/Math.max(im.width,im.height));var c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.72))};im.src=r.result};r.readAsDataURL(file)}
function upload(){var fs=$("fi").files;if(!CUR||!fs.length){$("us").textContent="اختار صور";return}
var i=0,t=$("ty").value;(function next(){if(i>=fs.length){$("us").textContent="تم رفع "+fs.length+" صور";$("fi").value="";photos();return}
$("us").textContent="جاري رفع "+(i+1)+" من "+fs.length;
shrink(fs[i++],function(d){call("upload",[TOK,CUR,t,d]).then(function(r){if(!sess(r))return;if(r&&r.error){$("us").textContent=r.error;return}next()}).catch(function(){$("us").textContent="فشل الرفع"})})})()}
function logout(){call("logout",[TOK]).then(function(){localStorage.removeItem("ar_tok");TOK=null;showLogin("")}).catch(function(){localStorage.removeItem("ar_tok");showLogin("")})}
function revokeAll(){if(!confirm("تخرج من كل الأجهزة؟"))return;call("revokeall",[TOK]).then(function(){localStorage.removeItem("ar_tok");TOK=null;showLogin("تم الخروج من كل الأجهزة")})}
var EC=null,FF=["name","phone","address","device","fault","status","price","paid","parts","notes","area","time"];
function editC(code){EC=code;$("es").textContent="";$("ed").style.display="block";$("et").textContent=code?"تعديل بيانات العميل":"عميل جديد";
FF.forEach(function(k){$("f_"+k).value=""});$("vrow").style.display="none";if(!code){$("f_status").value="تحت الفحص";$("ed").scrollIntoView({behavior:"smooth"});return}
call("get",[TOK,code]).then(function(r){if(!sess(r))return;r=r.r;if(!r||r.error){$("es").textContent="حصل خطأ";return}FF.forEach(function(k){$("f_"+k).value=r[k]||""});$("vrow").style.display=r.visit?"block":"none";$("ed").scrollIntoView({behavior:"smooth"})})}
function saveC(){var d={};FF.forEach(function(k){d[k]=$("f_"+k).value});$("es").style.color="#555";$("es").textContent="جاري الحفظ...";
call("save",[TOK,EC,d]).then(function(r){if(!sess(r))return;if(r.error){$("es").style.color="";$("es").textContent=r.error;return}$("ed").style.display="none";load()}).catch(function(){$("es").style.color="";$("es").textContent="فشل الحفظ، حاول تاني"})}
function loadAds(){call("adlist",[TOK]).then(function(r){if(!sess(r))return;var l=r.r||[];$("adl").innerHTML=l.length?l.map(function(a){return "<div class=cu><b>"+esc(a.title||"(بدون عنوان)")+"</b><small>"+esc(a.date)+" | "+esc(a.type||"رابط")+(a.visible?"":" | مخفي")+"</small><button class='btn s' onclick='adVis("+a.row+","+(a.visible?0:1)+")'>"+(a.visible?"إخفاء":"إظهار")+"</button><button class='btn s' onclick='adDel("+a.row+")'>مسح</button></div>"}).join(""):"مفيش إعلانات"})}
function adVis(r,v){call("adset",[TOK,r,!!v]).then(function(x){if(sess(x))loadAds()})}
function adDel(r){if(!confirm("مسح الإعلان نهائي؟"))return;call("addel",[TOK,r]).then(function(x){if(sess(x))loadAds()})}
function adPost(){var t=$("a_title").value,x=$("a_text").value,u=$("a_url").value.trim(),f=$("a_file").files[0];$("a_s").style.color="#555";
if(!u&&!f){$("a_s").textContent="اختار ملف أو حط رابط";return}
if(!u&&f.size>20e6){$("a_s").textContent="الملف أكبر من 20 ميجا";return}
$("a_s").textContent="جاري الرفع...";
var done=function(r){if(!sess(r))return;if(r.error){$("a_s").style.color="";$("a_s").textContent=r.error;return}$("a_s").textContent="تم النشر";["a_title","a_text","a_url"].forEach(function(k){$(k).value=""});$("a_file").value="";loadAds()};
var fail=function(){$("a_s").style.color="";$("a_s").textContent="فشل الرفع"};
if(u){call("adadd",[TOK,{title:t,text:x,url:u}]).then(done).catch(fail);return}
if(f.type.indexOf("image/")==0&&f.type!="image/gif"){shrink(f,function(d){call("adadd",[TOK,{title:t,text:x,mime:"image/jpeg",data:d.split(",")[1]}]).then(done).catch(fail)});return}
var rd=new FileReader();rd.onload=function(){call("adadd",[TOK,{title:t,text:x,mime:f.type,data:String(rd.result).split(",")[1]}]).then(done).catch(fail)};rd.readAsDataURL(f)}
if(TOK)showMain();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});

</script></body>
